<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitol Hill: The Markup</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <!-- Main Menu -->
        <div id="main-menu" class="screen active">
            <div class="menu-content">
                <h1 class="game-title">Capitol Hill</h1>
                <h2 class="game-subtitle">The Markup</h2>
                <p class="menu-controls">WASD or arrows to walk &middot; E or Space to talk &middot; big decisions happen where you walk</p>
                <div class="menu-buttons">
                    <button id="start-btn" class="menu-btn">Start Game</button>
                    <button id="continue-btn" class="menu-btn" disabled>Continue</button>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <!-- Background -->
            <div id="scene-background"></div>

            <!-- Top-down walkable room -->
            <canvas id="overworld-canvas"></canvas>
            <div id="objective"></div>
            <div id="controls-hint">WASD / arrows to move &middot; E to interact</div>
            <div id="toast"></div>
            <div id="timer"></div>

            <!-- Location Indicator -->
            <div id="location-indicator"></div>

            <!-- Character Portrait -->
            <div id="character-portrait"></div>

            <!-- Dialogue Box -->
            <div id="dialogue-box">
                <div id="character-name"></div>
                <div id="dialogue-text"></div>
                <div id="continue-indicator">▼</div>
            </div>

            <!-- Choice Container -->
            <div id="choice-container"></div>
        </div>
    </div>

    <script src="js/story.js"></script>
    <script src="js/dialogue.js"></script>
    <script src="js/overworld.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
